aid: eeye-digital
name: eEye Digital Security
description: eEye Digital Security was an American cybersecurity company and an early pioneer of commercial
  vulnerability management and vulnerability research. BeyondTrust acquired eEye Digital Security in May
  2012, and the company no longer operates as an independent entity or brand. Its former domain, eeye.com,
  now resolves to BeyondTrust infrastructure — the www host no longer presents a valid TLS certificate,
  and the domain's DMARC reporting addresses point at beyondtrust.com. eEye publishes no developer portal,
  documentation, API, SDK, package, or discovery surface of its own; the successor product surface, including
  the BeyondTrust Password Safe API, is catalogued in the API Evangelist network under the beyondtrust
  profile. This record is retained as a historical company entry and an acquisition pointer rather than
  as an active API provider.
